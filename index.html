<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login * Agenda Clínica</title>
    <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <main>
        <section>
            <div class="d-flex flex-column justify-content-center align-items-center min-vh-100 gap-1">
                <h3>Realize o login para acessar sua conta</h3>
                <form action="">
                    <div>
                        <label for="usuario">Usuário:</label>
                        <input type="text" name="lgUsuario" id="usuario" placeholder="Insira seu usuário" required="required">
                    </div>
                    <hr>
                    <div>
                        <label for="senha">Senha:</label>
                        <input type="password" name="lgSenha" id="passwordLg" required="required" placeholder="Insira sua senha">
                    </div>
                    <div>
                        <input type="submit" value="Acessar" id="acess" name="acessarMain">
                    </div>
                </form>
                <nav>
                    <section>
                        <div class="d-flex flex-column">
                            <a href="recuperarSenha.html">Esqueci minha senha</a>
                            <a href="cadastro.html">Realizar cadatro</a>
                            <a href="suport.html">Falar com suporte</a>
                            <a href="testBoots.html">Pagina teste</a>
                        </div>
                    </section>
                </nav>
            </div>
        </section>
    </main>
<script 
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
