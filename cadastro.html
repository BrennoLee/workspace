<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro * Agenda Clínica</title>
    <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <main>
        <section>
            <div class="d-flex flex-column justify-content-center align-items-center min-vh-100 gap-1">
                <h3>Realize o cadastro para acessar sua conta</h3>
                <form action="">
                    <div>
                        <label for="nome">Nome:</label>
                        <input type="text" name="nameUser" id="nameUser" placeholder="Digite o seu sobre nome" required="required">
                    </div>
                    <hr>
                    <div>
                        <label for="sobreNome">Sobre Nome:</label>
                        <input type="text" name="lastName" id="lastName" required="required" placeholder="Digite seu sobre nome">
                    </div>
                    <hr>
                    <div>
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required="required" placeholder="Digite seu E-mail"></input>
                    </div>
                    <hr>
                    <div>
                        <label for="nascimento">Data de Nascimento</label>
                        <input type="date" name="dataNascimento" id="dataNascimento" required="required placeholder="Digite sua data de nascimento">
                    </div>
                    <div>
                        <input type="submit" value="Cadastrar" id="check" name="acessCheckin">
                    </div>
                </form>
                <nav>
                    <section>
                        <div class="d-flex flex-column">
                            <a href="recuperarSenha.html">Esqueci minha senha</a>
                            <a href="index.html">Realizar login</a>
                            <a href="suport.html">Falar com suporte</a>
                            <a href="testBoots.html">Pagina teste</a>
                            <button onclick="alertTest()">Testa JS</button>

                            <p>Você digitou: <span id="resultado"></span></p>
                        </div>
                    </section>
                </nav>
            </div>
        </section>
    </main>
<script 
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>
<script src="app.js"></script>
</body>
</html>
